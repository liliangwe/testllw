spring:
  application:
    name: todo-service

  datasource:
    url: jdbc:mysql://localhost:3306/todo_db?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.antdigital.todo.model.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.antdigital.todo: INFO