server:
  port: 8080

spring:
  application:
    name: todo-app
  datasource:
    url: jdbc:mysql://localhost:3306/todo_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&connectTimeout=3000&socketTimeout=5000
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.todo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.example.todo.mapper: DEBUG

# 功能开关
todo:
  create:
    enabled: true

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true