server:
  port: 8080

spring:
  application:
    name: demo-track-app
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/demo_track?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

mybatis:
  mapper-locations: classpath:mapper/*.xml

track:
  enabled: true
export:
  enabled: true
