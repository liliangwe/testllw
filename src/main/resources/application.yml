server:
  port: 8080

spring:
  application:
    name: todo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息通过环境变量注入，禁止将账号密码写入配置文件
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:todo}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:todo}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 3000
      max-lifetime: 1800000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.todo.dao.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.todo: info
